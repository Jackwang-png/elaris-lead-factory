version: '1.0'

# CNB (cnb.cool) repo-file pipeline config.
# Schema (validated empirically): top-level '$' = default branch group;
# under it, event keys (push / merge_request / api_trigger) each hold a list of
# pipelines; each pipeline has `stages`, where every stage is an OBJECT with
# name / image / commands (NOT a `jobs:` map, and the command key is `commands`).
'$':
  push:
    - stages:
        - name: test
          image: node:20
          commands:
            - node --version
            - npm install -g typescript@5
            - cd apps/api
            - tsc -p tsconfig.ci.json || true
            - node --test dist-ci/elaris/*.test.js
        - name: build
          image: node:20
          commands:
            - node --version
            - corepack enable
            - corepack prepare pnpm@9 --activate
            - pnpm --version
            - pnpm install --frozen-lockfile
            - pnpm prisma:generate
            - pnpm --filter smartcs-api typecheck
            - pnpm test
            - pnpm build
            - pnpm --filter dashboard build

  merge_request:
    - stages:
        - name: test
          image: node:20
          commands:
            - node --version
            - npm install -g typescript@5
            - cd apps/api
            - tsc -p tsconfig.ci.json || true
            - node --test dist-ci/elaris/*.test.js
        - name: build
          image: node:20
          commands:
            - node --version
            - corepack enable
            - corepack prepare pnpm@9 --activate
            - pnpm --version
            - pnpm install --frozen-lockfile
            - pnpm prisma:generate
            - pnpm --filter smartcs-api typecheck
            - pnpm test
            - pnpm build
            - pnpm --filter dashboard build

  api_trigger:
    - stages:
        - name: test
          image: node:20
          commands:
            - node --version
            - npm install -g typescript@5
            - cd apps/api
            - tsc -p tsconfig.ci.json || true
            - node --test dist-ci/elaris/*.test.js
        - name: build
          image: node:20
          commands:
            - node --version
            - corepack enable
            - corepack prepare pnpm@9 --activate
            - pnpm --version
            - pnpm install --frozen-lockfile
            - pnpm prisma:generate
            - pnpm --filter smartcs-api typecheck
            - pnpm test
            - pnpm build
            - pnpm --filter dashboard build
