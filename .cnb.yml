version: '1.0'

# CNB (cnb.cool) repo-file pipeline config.
# Schema (validated empirically): top-level '$' = default branch group;
# under it, event keys (push / merge_request / api_trigger) each hold a list of
# pipelines; each pipeline has `stages`, where every stage is an OBJECT with
# name / image / commands (NOT a `jobs:` map, and the command key is `commands`).
#
# CI gate policy (honest, fail-closed):
#   - NO `|| true` anywhere: a real typecheck / test / build error MUST turn CI red.
#   - A single `build` stage does the full, dependency-installing verification:
#       pnpm install -> prisma:generate -> typecheck -> pnpm test -> build -> dashboard build
#   - The previous hand-rolled `test` stage (which ran `tsc` WITHOUT installing
#     deps and therefore always failed with "Cannot find type definition file
#     for 'node'") has been removed; its coverage is fully provided by this stage.
#   - PRISMA_ENGINES_MIRROR points at npmmirror so the Prisma engine binary can
#     be downloaded inside the CNB build network (same mirror used in local proof).
'$':
  push:
    - stages:
        - name: build
          image: node:20
          commands:
            - node --version
            - corepack enable
            - corepack prepare pnpm@9 --activate
            - pnpm --version
            - pnpm install --frozen-lockfile
            - DATABASE_URL="postgresql://elaris_ci:elaris_ci@localhost:5432/elaris_ci" PRISMA_ENGINES_MIRROR="https://registry.npmmirror.com/-/binary/prisma" pnpm prisma:generate
            - pnpm --filter smartcs-api typecheck
            - pnpm test
            - pnpm build
            - pnpm --filter dashboard build

  merge_request:
    - stages:
        - name: build
          image: node:20
          commands:
            - node --version
            - corepack enable
            - corepack prepare pnpm@9 --activate
            - pnpm --version
            - pnpm install --frozen-lockfile
            - DATABASE_URL="postgresql://elaris_ci:elaris_ci@localhost:5432/elaris_ci" PRISMA_ENGINES_MIRROR="https://registry.npmmirror.com/-/binary/prisma" pnpm prisma:generate
            - pnpm --filter smartcs-api typecheck
            - pnpm test
            - pnpm build
            - pnpm --filter dashboard build

  api_trigger:
    - stages:
        - name: build
          image: node:20
          commands:
            - node --version
            - corepack enable
            - corepack prepare pnpm@9 --activate
            - pnpm --version
            - pnpm install --frozen-lockfile
            - DATABASE_URL="postgresql://elaris_ci:elaris_ci@localhost:5432/elaris_ci" PRISMA_ENGINES_MIRROR="https://registry.npmmirror.com/-/binary/prisma" pnpm prisma:generate
            - pnpm --filter smartcs-api typecheck
            - pnpm test
            - pnpm build
            - pnpm --filter dashboard build
