version: '1.0'

'$':
  push:
    - stages:
        - test
        - build
      jobs:
        elaris_test:
          stage: test
          image: node:20
          script:
            - node --version
            - npm install -g typescript@5
            - cd apps/api
            - tsc -p tsconfig.ci.json || true
            - node --test dist-ci/elaris/*.test.js
        install_build:
          stage: build
          image: node:20
          script:
            - node --version
            - corepack enable
            - corepack prepare pnpm@9 --activate
            - pnpm --version
            - pnpm install --frozen-lockfile
            - pnpm prisma:generate
            - pnpm --filter smartcs-api typecheck
            - pnpm test
            - pnpm build
            - pnpm --filter dashboard build

  merge_request:
