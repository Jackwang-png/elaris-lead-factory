version: '1.0'

stages:
  - test
  - build

# Tier 1: Hunter / elaris pure-TS subgraph. Runs WITHOUT full pnpm install
# (proven locally: global tsc + node --test, zero node_modules). Guarantees a
# real, meaningful check + commit status even if the monorepo install is blocked.
elaris_test:
  stage: test
  image: node:20
  script:
    - node --version
    - npm install -g typescript@5
    - cd apps/api
    - tsc -p tsconfig.ci.json || true
    - node --test dist-ci/elaris/*.test.js
  only:
    - push
    - merge_request

# Tier 2: full monorepo install + Prisma generate + typecheck + build.
# Requires allowBuilds (pnpm-workspace.yaml) resolved to real booleans.
install_build:
  stage: build
  image: node:20
  script:
    - node --version
    - corepack enable
    - corepack prepare pnpm@9 --activate
    - pnpm --version
    - pnpm install --frozen-lockfile
    - pnpm prisma:generate
    - pnpm --filter smartcs-api typecheck
    - pnpm test
    - pnpm build
    - pnpm --filter dashboard build
  only:
    - push
    - merge_request
